services:
  valkey:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 2 bash -c 'echo > /dev/tcp/localhost/6379' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
